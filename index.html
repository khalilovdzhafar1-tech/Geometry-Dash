<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Neon Dash</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0b1028;color:white;font-family:Arial,sans-serif;padding:12px}.wrap{width:min(900px,100%)}header{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}h1{color:#5cf5ff;text-shadow:0 0 15px #00dfff}.stats{display:flex;gap:14px;align-items:center}button{border:0;border-radius:10px;padding:12px 18px;font-weight:bold;background:linear-gradient(90deg,#5cf5ff,#ff62d6);cursor:pointer}#sound{padding:8px 12px}#stage{position:relative;border:2px solid #5966bd;border-radius:14px;overflow:hidden}canvas{display:block;width:100%;height:auto;touch-action:manipulation}.cover{position:absolute;inset:0;display:grid;place-items:center;text-align:center;background:#080d25cc;padding:20px}.cover h2{font-size:clamp(28px,6vw,48px);color:#5cf5ff;margin:0 0 8px}.cover p{line-height:1.5}.hint{text-align:center;color:#b8c5ff;font-size:14px}
</style></head><body><main class="wrap"><header><h1>NEON DASH</h1><div class="stats"><span>⭐ <b id="score">0</b></span><span>BEST <b id="best">0</b></span><span>LEVEL <b id="level">1</b></span><button id="sound">🔊 SOUND</button></div></header>
<div id="stage"><canvas id="game" width="900" height="420"></canvas><div class="cover" id="cover"><div><h2 id="title">READY?</h2><p id="message">Springe über die pinken Spikes und lande auf Plattformen.<br>Leertaste, Pfeil hoch oder auf den Bildschirm tippen.</p><button id="start">SPIEL STARTEN</button></div></div></div><p class="hint">Springen: LEERTASTE / ↑ / W oder Bildschirm antippen</p></main>
<script>
(()=>{'use strict';
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');
const $=id=>document.getElementById(id),W=900,H=420,FLOOR=350;
let active=false,over=false,tick=0,score=0,best=0,level=1,speed=5,player,spikes=[],platforms=[],coins=[],sound=true,audio;
try{best=Number(localStorage.getItem('nd-best')||0)}catch(e){} $('best').textContent=best;
function beep(f=500,d=.1,w='sine'){if(!sound)return;try{audio=audio||new(window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume();let o=audio.createOscillator(),g=audio.createGain();o.type=w;o.frequency.value=f;g.gain.setValueAtTime(.05,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+d);o.connect(g);g.connect(audio.destination);o.start();o.stop(audio.currentTime+d)}catch(e){}}
function reset(){tick=0;score=0;level=1;speed=5;player={x:120,y:FLOOR-34,w:34,h:34,vy:0,grounded:true};spikes=[];platforms=[];coins=[];$('score').textContent='0';$('level').textContent='1'}
function start(){reset();active=true;over=false;$('cover').style.display='none'}
function jump(){if(!active){if(!over)start();return}if(player.grounded){player.vy=-13;player.grounded=false;beep(420,.08,'square')}}
function finish(){active=false;over=true;beep(130,.25,'sawtooth');best=Math.max(best,Math.floor(score));try{localStorage.setItem('nd-best',best)}catch(e){}$('best').textContent=best;$('title').textContent='CRASH!';$('message').textContent='Punkte: '+Math.floor(score)+' – versuch es nochmal!';$('start').textContent='NOCHMAL SPIELEN';$('cover').style.display='grid'}
function draw(){ctx.clearRect(0,0,W,H);let g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#1a2252');g.addColorStop(1,'#10152e');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
ctx.strokeStyle='#303b70';ctx.lineWidth=1;for(let x=0;x<W;x+=45){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke()}
ctx.fillStyle='#25315d';ctx.fillRect(0,FLOOR,W,H-FLOOR);ctx.fillStyle='#55f5ff';ctx.fillRect(0,FLOOR,W,3);
platforms.forEach(p=>{ctx.fillStyle='#a45bff';ctx.fillRect(p.x,p.y,p.w,12);ctx.fillStyle='#e5c8ff';ctx.fillRect(p.x,p.y,p.w,3)});
spikes.forEach(o=>{ctx.fillStyle='#ff4d9d';ctx.beginPath();ctx.moveTo(o.x,FLOOR);ctx.lineTo(o.x+17,FLOOR-o.h);ctx.lineTo(o.x+34,FLOOR);ctx.fill()});
coins.forEach(c=>{ctx.fillStyle='#ffe66d';ctx.beginPath();ctx.arc(c.x,c.y,9,0,Math.PI*2);ctx.fill()});
if(player){ctx.save();ctx.shadowBlur=22;ctx.shadowColor='#00eaff';ctx.fillStyle='#55edff';ctx.fillRect(player.x,player.y,player.w,player.h);ctx.shadowBlur=0;ctx.strokeStyle='white';ctx.lineWidth=3;ctx.strokeRect(player.x+4,player.y+4,player.w-8,player.h-8);ctx.restore()}}
function update(){if(!active)return;tick++;score+=.12;speed+=.0005;let nl=1+Math.floor(score/200);if(nl!==level){level=nl;$('level').textContent=level;beep(800,.16)}
let prev=player.y+player.h;player.vy+=.6;player.y+=player.vy;player.grounded=false;
for(const p of platforms){if(player.vy>=0&&prev<=p.y&&player.y+player.h>=p.y&&player.x+player.w>p.x&&player.x<p.x+p.w){player.y=p.y-player.h;player.vy=0;player.grounded=true}}
if(player.y+player.h>=FLOOR){player.y=FLOOR-player.h;player.vy=0;player.grounded=true}
if(tick%75===0){let n=1+(Math.random()<.45?1:0)+(level>3&&Math.random()<.25?1:0);for(let i=0;i<n;i++)spikes.push({x:W+20+i*33,h:30+Math.random()*24})}
if(tick%165===0)platforms.push({x:W+10,y:FLOOR-105-Math.random()*30,w:145});
if(tick%100===0)coins.push({x:W+10,y:FLOOR-80-Math.random()*80});
spikes.forEach(o=>o.x-=speed);platforms.forEach(p=>p.x-=speed);coins.forEach(c=>c.x-=speed);
spikes=spikes.filter(o=>o.x+34>0);platforms=platforms.filter(p=>p.x+p.w>0);coins=coins.filter(c=>c.x>0);
for(const o of spikes){if(player.x+player.w-5>o.x+7&&player.x+5<o.x+27&&player.y+player.h>FLOOR-o.h+9){finish();break}}
coins=coins.filter(c=>{let hit=Math.abs((player.x+17)-c.x)<24&&Math.abs((player.y+17)-c.y)<24;if(hit){score+=5;beep(900,.08)}return !hit});$('score').textContent=Math.floor(score)}
function loop(){try{update();draw()}catch(e){active=false;$('title').textContent='SPIELFEHLER';$('message').textContent='Bitte Seite neu laden.';$('cover').style.display='grid'}requestAnimationFrame(loop)}
$('start').addEventListener('click',start);$('sound').addEventListener('click',()=>{sound=!sound;$('sound').textContent=sound?'🔊 SOUND':'🔇 SOUND';if(sound)beep()});
canvas.addEventListener('pointerdown',jump);window.addEventListener('keydown',e=>{if(['Space','ArrowUp','KeyW'].includes(e.code)){e.preventDefault();if(over)start();else jump()}});
reset();loop();
})();
</script></body></html>
