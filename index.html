<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>NEON PARKOUR</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#090e20;color:#fff;font-family:Arial,sans-serif;padding:12px;display:grid;place-items:center}.wrap{width:min(960px,100%)}header{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}h1{color:#65f6ff;text-shadow:0 0 16px #00dfff;margin:8px 0}.stats{display:flex;gap:12px;align-items:center;flex-wrap:wrap}button{border:0;border-radius:11px;padding:11px 16px;font-weight:bold;background:linear-gradient(90deg,#55edff,#ff65d4);color:#081020;touch-action:manipulation;cursor:pointer}#stage{position:relative;border:2px solid #5668c9;border-radius:14px;overflow:hidden;background:#111a38}canvas{display:block;width:100%;height:auto;touch-action:none}.cover{position:absolute;inset:0;z-index:4;display:grid;place-items:center;text-align:center;background:#080d25dd;padding:20px}.cover h2{font-size:clamp(30px,6vw,52px);color:#60f4ff;margin:0 0 8px}.cover p{line-height:1.5}.hint{text-align:center;color:#b8c5ff;font-size:14px}.controls{display:flex;justify-content:center;gap:14px;margin:12px auto 0}.controls button{min-width:74px;font-size:20px;background:#283765;color:white;border:1px solid #7186e9}.controls .jump{background:linear-gradient(90deg,#55edff,#ff65d4);color:#081020;min-width:130px}#stage:fullscreen{width:100vw;height:100vh;border:0;border-radius:0;display:grid;place-items:center}#stage:fullscreen canvas{width:100%;height:100%;object-fit:contain}body:has(#stage:fullscreen){padding:0;display:block}body:has(#stage:fullscreen) .wrap{width:100vw}body:has(#stage:fullscreen) header,body:has(#stage:fullscreen) .hint,body:has(#stage:fullscreen) .controls{display:none}
</style></head><body><main class="wrap"><header><h1>NEON PARKOUR</h1><div class="stats"><span>⭐ <b id="score">0</b></span><span>BEST <b id="best">0</b></span><button id="full">⛶ VOLLBILD</button></div></header>
<div id="stage"><canvas id="game" width="960" height="480"></canvas><div class="cover" id="cover"><div><h2 id="title">NEON PARKOUR</h2><p id="message">Renne über Dächer, springe über Abgründe und sammle Sterne!<br>Steuerung: A/D oder ←/→ zum Laufen, SPACE oder ↑ zum Springen.</p><button id="start">PARKOUR STARTEN</button></div></div></div>
<div class="controls"><button id="left">◀</button><button class="jump" id="jump">SPRINGEN ⬆</button><button id="right">▶</button></div><p class="hint">PC: A/D oder ←/→ laufen · SPACE / ↑ springen · Handy: Tasten benutzen</p></main>
<script>
(()=>{'use strict';
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d'),$=id=>document.getElementById(id),W=960,H=480;
let running=false,dead=false,frame=0,score=0,best=0,camera=0,keys={},player,platforms=[],stars=[],hazards=[],audio;
try{best=Number(localStorage.getItem('parkour-best')||0)}catch(e){}$('best').textContent=best;
function tone(f=500){try{audio=audio||new(window.AudioContext||window.webkitAudioContext)();let o=audio.createOscillator(),g=audio.createGain();o.frequency.value=f;g.gain.value=.04;g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+.12);o.connect(g);g.connect(audio.destination);o.start();o.stop(audio.currentTime+.12)}catch(e){}}
function reset(){frame=0;score=0;camera=0;player={x:130,y:330,w:30,h:42,vx:0,vy:0,onGround:false};platforms=[{x:0,y:390,w:520},{x:590,y:350,w:250},{x:900,y:310,w:260},{x:1220,y:370,w:300},{x:1580,y:330,w:300}];stars=[];hazards=[];$('score').textContent=0}
function start(){reset();running=true;dead=false;$('cover').style.display='none'}
function end(){running=false;dead=true;best=Math.max(best,Math.floor(score));try{localStorage.setItem('parkour-best',best)}catch(e){}$('best').textContent=best;$('title').textContent='ABGESTÜRZT!';$('message').textContent='Du hast '+Math.floor(score)+' Punkte geschafft. Noch ein Versuch?';$('start').textContent='NOCHMAL SPIELEN';$('cover').style.display='grid';tone(120)}
function jump(){if(!running){if(!dead)start();return}if(player.onGround){player.vy=-13.5;player.onGround=false;tone(650)}}
function hold(id,code){const b=$(id);b.addEventListener('pointerdown',e=>{e.preventDefault();keys[code]=true});['pointerup','pointerleave','pointercancel'].forEach(ev=>b.addEventListener(ev,e=>{e.preventDefault();keys[code]=false}))}
hold('left','left');hold('right','right');$('jump').addEventListener('pointerdown',e=>{e.preventDefault();jump()});
function draw(){ctx.clearRect(0,0,W,H);let sky=ctx.createLinearGradient(0,0,0,H);sky.addColorStop(0,'#182657');sky.addColorStop(1,'#101326');ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);
for(let i=0;i<12;i++){let x=((i*110-camera*.25)%1200+1200)%1200;let bh=80+(i*37%130);ctx.fillStyle='#202e59';ctx.fillRect(x,H-bh-40,65,bh+40);ctx.fillStyle='#3c4d80';for(let y=H-bh-25;y<H-55;y+=24)ctx.fillRect(x+12,y,8,9)}
ctx.fillStyle='#55f2ff';ctx.font='bold 14px Arial';ctx.fillText('NEON CITY  •  PARKOUR RUN',22,28);
platforms.forEach(p=>{let x=p.x-camera;if(x+p.w<0||x>W)return;ctx.fillStyle='#293967';ctx.fillRect(x,p.y,p.w,H-p.y);ctx.fillStyle='#5cf5ff';ctx.fillRect(x,p.y,p.w,5);ctx.fillStyle='#40558c';for(let bx=x+18;bx<x+p.w-10;bx+=45)ctx.fillRect(bx,p.y+22,22,5)});
hazards.forEach(h=>{let x=h.x-camera;ctx.fillStyle='#ff4f9a';ctx.beginPath();ctx.moveTo(x,h.y);ctx.lineTo(x+17,h.y-28);ctx.lineTo(x+34,h.y);ctx.fill()});
stars.forEach(s=>{let x=s.x-camera;ctx.fillStyle='#ffe66d';ctx.beginPath();ctx.arc(x,s.y,9,0,Math.PI*2);ctx.fill()});
if(player){let x=player.x-camera;ctx.save();ctx.translate(x+15,player.y+21);ctx.rotate(player.onGround?Math.sin(frame*.2)*.08:Math.min(.5,Math.max(-.5,player.vy*.035)));ctx.shadowBlur=18;ctx.shadowColor='#55edff';ctx.fillStyle='#55edff';ctx.fillRect(-14,-20,28,38);ctx.shadowBlur=0;ctx.strokeStyle='white';ctx.lineWidth=3;ctx.strokeRect(-10,-16,20,30);ctx.fillStyle='#121b3a';ctx.fillRect(1,-9,4,4);ctx.restore()}
ctx.fillStyle='#ffffff44';ctx.fillRect(22,44,200,6);ctx.fillStyle='#ff65d4';ctx.fillRect(22,44,Math.min(200,(score%100)*2),6)}
function update(){if(!running)return;frame++;let dir=(keys.right||keys.KeyD||keys.ArrowRight?1:0)-(keys.left||keys.KeyA||keys.ArrowLeft?1:0);player.vx=dir*4.6;player.x+=player.vx;player.x=Math.max(camera+40,Math.min(camera+W-170,player.x));let oldBottom=player.y+player.h;player.vy+=.62;player.y+=player.vy;player.onGround=false;
for(const p of platforms){if(player.vy>=0&&oldBottom<=p.y+3&&player.y+player.h>=p.y&&player.x+player.w>p.x&&player.x<p.x+p.w){player.y=p.y-player.h;player.vy=0;player.onGround=true}}
if(player.y>H+80){end();return}
camera=Math.max(0,player.x-250);if(player.x>platforms[platforms.length-1].x-300){let last=platforms[platforms.length-1],gap=100+Math.random()*80,w=180+Math.random()*170,y=300+Math.random()*90;platforms.push({x:last.x+last.w+gap,y,w});if(Math.random()<.8)stars.push({x:last.x+last.w+gap/2+30,y:y-55-Math.random()*35});if(Math.random()<.55)hazards.push({x:last.x+last.w+gap+w*.55,y:y})}
platforms=platforms.filter(p=>p.x+p.w>camera-100);stars=stars.filter(s=>{if(Math.abs(player.x+15-s.x)<23&&Math.abs(player.y+18-s.y)<30){score+=10;tone(900);return false}return s.x>camera-40});hazards=hazards.filter(h=>h.x>camera-40);
for(const h of hazards){if(player.x+player.w>h.x+4&&player.x<h.x+30&&player.y+player.h>h.y-25&&player.y+player.h<h.y+18){end();return}}
score+=.035;$('score').textContent=Math.floor(score)}
function loop(){update();draw();requestAnimationFrame(loop)}
$('start').addEventListener('click',start);$('full').addEventListener('click',async()=>{try{if(!document.fullscreenElement)await $('stage').requestFullscreen();else await document.exitFullscreen()}catch(e){}});
document.addEventListener('keydown',e=>{if(['Space','ArrowUp','ArrowLeft','ArrowRight'].includes(e.code))e.preventDefault();keys[e.code]=true;if(e.code==='Space'||e.code==='ArrowUp'||e.code==='KeyW'){if(!running&&dead)start();else jump()}});
document.addEventListener('keyup',e=>keys[e.code]=false);$('stage').addEventListener('pointerdown',e=>{if(e.target===$('game'))jump()});reset();loop();
})();
</script></body></html>
